    <link rel="stylesheet" href="css/style.css" />
    <title>Linnie's ceramic work</title>
  </head>
  <body>
    <header>
      <h1><u>Linnie's Ceramic Site</u></h1>
    </header>
    <nav>
      <span class="navigationBar">
        <span class="navigationButton"> <a href="./Home.html"> HOME </a> </span>
        <span class="navigationButton">
          <a href="./MyWork.html"> MY WORK</a>
        </span>
        <span class="navigationButton"> <a href="./Blog.html"> BLOG</a> </span>

    <br />
    <main>
      <h3 class="subHeadings">My Ceramic Pottery Collection</h3>
      <section id="ceramicImageContainer">
        <div class="ceramicImageContainerInnerTop">
          <img
            class="ceramicImageSmall"
            src="Assets/ClaypotOnWheel.jpg"
            alt="Progress of a clay pot on the wheel"
          />
          <img
            class="ceramicImageSmall"
            src="Assets/HoldingClaypot.jpg"
            alt="Image of holding a clay pot"
          />
          <img
            class="ceramicImageSmall"
            src="Assets/ThreeDryClaypots.jpg"
            alt="Three dry clay pots"
          />

            class="ceramicImageSmall"
            src="Assets/PaintingClaypotProgress.jpg"
            alt="Painting cute design on a clay pot"
          />

            class="ceramicImageSmall"
            src="Assets/PotteryOnShelf.jpg"
            alt="Colourful pottery on a shelf"
          />

        <div class="ceramicImageContainerInnerBottom">
          <img
            class="ceramicImageWide"
            src="Assets/ThreePaintedClaypot.jpg"
            alt="Holding pink ceramic pot"
          />

            class="ceramicImageWide"
            src="Assets/ThreePaintedPlantpot.jpg"
            alt="Three painted plant pots on a shelf"
          />
          <img

            src="Assets/HoldingPaintedClaypots.jpg"
